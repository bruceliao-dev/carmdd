dataset:
  name: avec2019
  root: /path/to/AVEC2019_features
  num_classes: 1
  use_text: false          # METER + text encoder disabled (Sec. 4.1)
  use_regression: true     # PHQ-8 regression active
  phq8_threshold: 10
  fps: 30

model:
  d_model: 512
  n_heads: 8
  n_memory: 64
  top_k: 8
  segment_len: 64
  segment_stride: 32
  meter: true              # gated by use_text at runtime
  gating: true
  memory: true
  bge_m3: true             # gated by use_text at runtime
  bge_m3_name: BAAI/bge-m3
  vit_name: google/vit-base-patch16-224
  ast_name: MIT/ast-finetuned-audioset-10-10-0.4593

train:
  epochs: 50
  batch_size: 32
  lr: 2.0e-5
  weight_decay: 0.01
  alpha: 0.7
  beta: 0.3
  patience: 10
  seeds: [42, 43, 44, 45, 46]
  output_dir: runs/avec2019